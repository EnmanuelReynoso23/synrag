[package]
name = "synrag_crawler"
version = "0.1.0"
edition = "2021"
authors = ["Enmanuel Reynoso"]
description = "Fast parallel codebase crawler and secret sanitizer for SynRAG"

[lib]
name = "synrag_crawler"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
ignore = "0.4"
rayon = "1.10"
regex = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
