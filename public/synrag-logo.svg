<svg width="450" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo Dark Mode (Estilo GitHub/Cursor) -->
  <rect width="100%" height="100%" fill="#0D1117" rx="12"/>
  
  <!-- Conexiones del Árbol (AST) -->
  <line x1="45" y1="60" x2="80" y2="35" stroke="#30363D" stroke-width="3"/>
  <line x1="45" y1="60" x2="80" y2="85" stroke="#30363D" stroke-width="3"/>
  <line x1="80" y1="35" x2="115" y2="60" stroke="#30363D" stroke-width="3"/>
  
  <!-- Nodos del Árbol -->
  <circle cx="45" cy="60" r="7" fill="#8B949E"/>
  <circle cx="80" cy="85" r="7" fill="#8B949E"/>
  <circle cx="80" cy="35" r="7" fill="#8B949E"/>
  
  <!-- El Nodo Extraído (El bloque perfecto de código) -->
  <circle cx="115" cy="60" r="10" fill="#00E5FF"/>
  <circle cx="115" cy="60" r="14" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>

  <!-- Tipografía del Nombre -->
  <text x="155" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    SYN<tspan fill="#00E5FF">RAG</tspan>
  </text>
  
  <!-- Tagline súper sutil abajo -->
  <text x="157" y="96" font-family="monospace" font-size="11" fill="#8B949E" letter-spacing="1">
    AST-NATIVE MCP ENGINE
  </text>
</svg>
